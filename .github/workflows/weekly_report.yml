name: Weekly AI & Automation Report

on:
  schedule:
    # Every Monday at 07:00 UTC (07:00 UK winter / 08:00 UK summer)
    - cron: '0 7 * * 1'
  workflow_dispatch:
    # Run manually from GitHub any time: Actions tab → Weekly AI Report → Run workflow

permissions:
  contents: write   # FIX 3: needed to commit and push the saved report file

jobs:
  generate-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report and notify clients
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          GHL_WEBHOOK_URL:      ${{ secrets.GHL_WEBHOOK_URL }}
          GOOGLE_CREDENTIALS:   ${{ secrets.GOOGLE_CREDENTIALS }}
          FALLBACK_DOC_URL:     https://tulivodigital.com
        run: python run_weekly.py

      - name: Save report to repository
        run: |
          git config user.name  "Tulivo Report Bot"
          git config user.email "bot@tulivodigital.com"
          git add weekly-report-*.md
          git diff --staged --quiet || git commit -m "Weekly report $(date +'%Y-%m-%d')"
          git push origin HEAD
